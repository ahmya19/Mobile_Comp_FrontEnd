<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
  <body style="font-family:Arial,sans-serif;color:#172a3a;line-height:1.6;padding:24px">
    <h1>Reset your PinPoint password</h1>
    <p>Return to PinPoint and enter this six-digit code, then choose a new password:</p>
    <p style="font-size:32px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
    <p>The code expires in 10 minutes. Never share it with anyone, including barangay staff.</p>
    <p>If you did not ask to reset your password, you can ignore this message.</p>
  </body>
</html>
