<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
  <body style="font-family:Arial,sans-serif;color:#172a3a;line-height:1.6;padding:24px">
    <h1>Confirm your PinPoint email</h1>
    <p>Return to PinPoint and enter this six-digit confirmation code:</p>
    <p style="font-size:32px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
    <p>Do not share this code. If it expires, request another code in the app.</p>
    <p>If you did not create a PinPoint account, you can ignore this message.</p>
  </body>
</html>
